[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bioms-zaku"
dynamic = ["version"]
description = "BioMS Zaku: algebraic decomposition and out-of-sample audit of indices and predictive equations (demonstrated on bioimpedance)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thalles Mota", email = "thallesleandromota@gmail.com"}]
keywords = ["bioimpedance", "body composition", "validation", "negative control", "redundancy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "threadpoolctl>=3",
  "pyyaml>=6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
xgboost = ["xgboost>=2"]
dev = ["pytest>=8", "build", "twine"]
excel = ["openpyxl>=3.1"]   # EN: optional — tables.xlsx next to the report

[project.urls]
Homepage = "https://github.com/bioms-zaku-framework/bioms-zaku"

[project.scripts]
bioms-zaku = "bioms_zaku.cli:entry"

[tool.hatch.version]
path = "src/bioms_zaku/__init__.py"   # EN: single source of the version

[tool.hatch.build.targets.wheel]
packages = ["src/bioms_zaku"]

[tool.hatch.build.targets.wheel.force-include]
# EN: the installed package carries ONE example base (the decision of 2026-09-17) plus its parameters and the notebook —
#     34 + 11 + 63 KB. The technical files (the older 8000-row example, the spreadsheet-format one, the real NHANES
#     sample and the YAMLs) stay in the repository and in the sdist: shipping them added 700 KB to every installation
#     for data the researcher never uses (2026-09-19).
"examples/zaku_exemplo.csv" = "bioms_zaku/examples/zaku_exemplo.csv"
"examples/zaku_exemplo_params.json" = "bioms_zaku/examples/zaku_exemplo_params.json"
"examples/zaku_exemplo.ipynb" = "bioms_zaku/examples/zaku_exemplo.ipynb"

[tool.hatch.build.targets.sdist]
include = ["src/bioms_zaku", "tests", "examples", "tools", "README.md", "README.es.md", "README.pt.md",
           "README.it.md", "GUIDE_10_MINUTES.md", "GUIDE_10_MINUTES.es.md", "GUIDE_10_MINUTES.pt.md",
           "GUIDE_10_MINUTES.it.md", "LICENSE", "CONTRATOS.md", "CONTRACTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
