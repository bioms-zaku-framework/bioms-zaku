[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bioms-zaku"
version = "0.1.0.dev0"
description = "BioMS Zaku: algebraic decomposition and predictive audit of indices and predictive equations (demonstrated on bioimpedance)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thalles Mota", email = "thallesleandromota@gmail.com"}]
keywords = ["bioimpedance", "body composition", "validation", "negative control", "redundancy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "pyyaml>=6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
xgboost = ["xgboost>=2"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ThallesLM/bioms-zaku"

[project.scripts]
bioms-zaku = "bioms_zaku.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bioms_zaku"]

[tool.hatch.build.targets.sdist]
include = ["src/bioms_zaku", "data", "tests", "README.md", "LICENSE", "CONTRATOS.md", "PROJETO.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
