<svg viewBox="0 0 980 420" role="img" aria-label="Flow of the framework: measured variables are decomposed into exponent vectors and a covariance matrix; existing indices are audited for redundancy, specificity against a negative control and added value; new indices are designed on one partition and audited on another; outputs are verdict tables, a manifest and a report; the same flow applies to body composition, clinical status and performance problems." style="max-width:100%;height:auto;font-family:inherit">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.2">
<rect x="20" y="120" width="190" height="120" rx="12"/>
<rect x="290" y="120" width="190" height="120" rx="12"/>
<rect x="560" y="40" width="200" height="120" rx="12"/>
<rect x="560" y="210" width="200" height="120" rx="12"/>
<rect x="820" y="120" width="140" height="120" rx="12"/>
<line x1="210" y1="180" x2="288" y2="180" marker-end="url(#ar)"/>
<line x1="480" y1="165" x2="558" y2="105" marker-end="url(#ar)"/>
<line x1="480" y1="195" x2="558" y2="265" marker-end="url(#ar)"/>
<line x1="760" y1="105" x2="818" y2="165" marker-end="url(#ar)"/>
<line x1="760" y1="265" x2="818" y2="195" marker-end="url(#ar)"/>
<line x1="490" y1="385" x2="490" y2="245" stroke-dasharray="4 4" marker-end="url(#ar)"/>
</g>
<g fill="currentColor" font-size="12">
<text x="115" y="145" text-anchor="middle" font-weight="600">measured variables</text>
<text x="115" y="168" text-anchor="middle">R · Xc · height · weight</text>
<text x="115" y="186" text-anchor="middle" opacity=".75">+ other positive signals</text>
<text x="115" y="204" text-anchor="middle" opacity=".75">(heart rate, force, …)</text>
<text x="385" y="145" text-anchor="middle" font-weight="600">decomposition</text>
<text x="385" y="168" text-anchor="middle">index → vector of exponents</text>
<text x="385" y="186" text-anchor="middle">population → Σ (log-covariance)</text>
<text x="385" y="204" text-anchor="middle" opacity=".75">predicts correlations analytically</text>
<text x="660" y="65" text-anchor="middle" font-weight="600">audit existing indices</text>
<text x="660" y="88" text-anchor="middle">redundancy + precedence</text>
<text x="660" y="106" text-anchor="middle">specificity vs negative control</text>
<text x="660" y="124" text-anchor="middle">added value over covariates</text>
<text x="660" y="142" text-anchor="middle" opacity=".75">out of sample, paired resamples</text>
<text x="660" y="235" text-anchor="middle" font-weight="600">design a new index</text>
<text x="660" y="258" text-anchor="middle">fit exponents on the design partition</text>
<text x="660" y="276" text-anchor="middle">audit on the disjoint partition</text>
<text x="660" y="294" text-anchor="middle" opacity=".75">per stratum · circularity declared</text>
<text x="890" y="145" text-anchor="middle" font-weight="600">outputs</text>
<text x="890" y="168" text-anchor="middle">verdict sheet</text>
<text x="890" y="186" text-anchor="middle">tables · manifest</text>
<text x="890" y="204" text-anchor="middle">report.html</text>
<text x="249" y="172" text-anchor="middle" font-size="10" opacity=".8">log</text>
<text x="519" y="128" text-anchor="middle" font-size="10" opacity=".8">vectors, Σ</text>
<text x="519" y="242" text-anchor="middle" font-size="10" opacity=".8">target</text>
<text x="490" y="404" text-anchor="middle" font-size="11" opacity=".85">problem: body composition (regression) · clinical status (classification) · performance (measured outcome)</text>
</g></svg>