# EN: continuous integration — fast suite on 3 Python versions + package build check; slow equivalence tests are skipped
#     (they need the reference NHANES data, which are not in the repository).
# ES: integración continua — suite rápida en 3 versiones de Python + construcción del paquete.
# PT: integração contínua — suíte rápida em 3 versões de Python + construção do pacote.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Install (package + plots + dev)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plots,dev]"
      - name: "Fast suite (equivalence tests skipped: reference data not in repo)"
        run: python -m pytest -q -m "not slow"
      - name: Example run (quick preset) must succeed and be deterministic
        run: |
          bioms-zaku run examples/minimo.yaml
          python - <<'PY'
          import json, shutil, subprocess
          a = json.load(open("zaku_out/minimo/manifest.json"))["outputs_sha256"]
          shutil.rmtree("zaku_out/minimo")
          subprocess.run(["bioms-zaku", "run", "examples/minimo.yaml"], check=True, capture_output=True)
          b = json.load(open("zaku_out/minimo/manifest.json"))["outputs_sha256"]
          assert a == b, "outputs differ between two identical runs"
          print("deterministic:", len(a), "output files")
          PY
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
