# EN: continuous integration — the package is BUILT and INSTALLED FROM THE WHEEL (never editable), the whole suite runs
#     against that installation, and an 'external user' step runs init/check/run from a directory outside the repository.
#     Motivated by the Colab simulation of 2026-09-14: an editable install hid that the catalogue was not shipped.
# ES: integración continua — instalación desde el wheel + suite + paso de usuario externo fuera del repositorio.
# PT: integração contínua — instalação a partir do wheel + suíte + passo de usuário externo fora do repositório.
name: ci
# EN: OFF from 2026-09-18 to 2026-09-23, and ON again since (user decision, on making the repository public).
#     It was switched off because GitHub Actions is billed on a PRIVATE repository and the matrix cost about 150
#     minutes per push (5 jobs x ~30 min), which exhausted the quota: jobs stopped starting and every push mailed a
#     failure that was a bill, not a defect. On a PUBLIC repository Actions is free, and the matrix is the only thing
#     that covers Python 3.10, 3.12 and 3.13 — `tools/gate.py` and the pre-commit hook run locally on 3.11 alone.
#     Local rigour stays as it is; this adds the versions the bench cannot reach.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Build the wheel and install it like a user (no editable install)"
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl matplotlib pytest twine openpyxl   # openpyxl: the optional [excel] path is tested too
          python -c "import bioms_zaku, pathlib; print(bioms_zaku.__file__)"
      - name: "Test suite (self-contained)"
        run: python -m pytest -q
      # EN: the fixture lives in tests/ since 2026-09-20 — `minimal.yaml` and `minimal_data.csv` are the fixture of
      #     13 test files and of steps 4 and 5 of tools/gate.py, not an example a researcher should open. This file
      #     still said examples/ and the workflow was dormant, so nothing noticed until it ran again on 2026-09-23.
      - name: Example run (quick preset) must succeed and be deterministic
        run: |
          bioms-zaku run tests/minimal.yaml
          python - <<'PY'
          import json, shutil, subprocess
          a = json.load(open("zaku_out/minimal/manifest.json"))["outputs_sha256"]
          shutil.rmtree("zaku_out/minimal")
          subprocess.run(["bioms-zaku", "run", "tests/minimal.yaml"], check=True, capture_output=True)
          b = json.load(open("zaku_out/minimal/manifest.json"))["outputs_sha256"]
          assert a == b, "outputs differ between two identical runs"
          print("deterministic:", len(a), "output files")
          PY
      - name: "External user: init/check/run from a directory outside the repository"
        run: |
          mkdir -p /tmp/usuario && cp tests/minimal_data.csv /tmp/usuario/meus_dados.csv && cd /tmp/usuario
          bioms-zaku init meus_dados.csv -o estudo.yaml --map R=resistencia_ohm Xc=reatancia_ohm H=estatura_cm W=massa_kg target=lmi_dxa control=fmi_dxa covariates=massa_kg,estatura_cm strata=sexo id=seqn independent=yes
          bioms-zaku check estudo.yaml
          python - <<'PY'
          import yaml; c = yaml.safe_load(open("estudo.yaml")); c["preset"] = "quick"; c.setdefault("audit", {}).setdefault("bootstrap", {})["min_oob"] = 10; yaml.safe_dump(c, open("estudo.yaml", "w"))
          PY
          bioms-zaku run estudo.yaml
          test -f zaku_out/*/report.html && test -f zaku_out/*/geometry.csv && echo "external user OK"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
