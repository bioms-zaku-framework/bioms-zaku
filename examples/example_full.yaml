run_name: example_full
data:
  path: examples/example_data.csv
  columns:
    variables:
      R: R
      Xc: Xc
      H: H_cm
      W: W
    units:
      H: cm
      W: kg
    covariates:
    - W
    - H_cm
    groups:
      sexo: sexo
      idade: idade
      C_arm: BMXARMC
      C_waist: BMXWAIST
      C_calf: BMXCALF
    id: id
    targets:
      LMI_DXA: LMI_DXA
      ALMI_DXA: ALMI_DXA
    controls:
      FMI_DXA: FMI_DXA
    pairing:
      LMI_DXA: FMI_DXA
      ALMI_DXA: FMI_DXA
strata: sexo
strata_labels:
  0: F
  1: M
catalog:
  include:
  - Lukaski1985_II
  - Baumgartner1988_PhA
  - Piccoli1994_RH
  - Piccoli1994_XcH
  - LMI
  - Rsp
  - Xcsp
declarations:
  targets_independent_of_variables: true
  target_kinds:
    LMI_DXA: lean_mass
    ALMI_DXA: lean_mass
    FMI_DXA: fat_mass
preset: full
n_jobs: 8
output:
  dir: ./zaku_out
  figures: true
figures:
  title: Synthetic example · lean mass index (LMI) vs fat mass index (FMI)
  subtitle: 7 curated indices · preset full (5×50 CV, B = 2000)
  language: en
  labels: full
