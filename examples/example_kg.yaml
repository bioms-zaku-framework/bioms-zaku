run_name: example_kg
data:
  path: examples/example_data.csv
  columns:
    variables:
      R: R
      Xc: Xc
      H: H_cm
      W: W
    units:
      H: cm
      W: kg
    covariates:
    - W
    - H_cm
    groups:
      sexo: sexo
      idade: idade
      C_arm: BMXARMC
      C_waist: BMXWAIST
      C_calf: BMXCALF
    id: id
    targets:
      lean_kg: lean_kg          # EN: absolute masses (index × H²): removes H from both sides, NOT the coupling through W (§3.3)
      alm_kg: alm_kg
    controls:
      fat_kg: fat_kg
    pairing:
      lean_kg: fat_kg
      alm_kg: fat_kg
strata: sexo
strata_labels:
  0: F
  1: M
catalog:
  include:
  - Lukaski1985_II
  - Baumgartner1988_PhA
  - Piccoli1994_RH
  - Piccoli1994_XcH
  - LMI
  - Rsp
  - Xcsp
declarations:
  targets_independent_of_variables: true
  target_kinds:
    lean_kg: lean_mass
    alm_kg: lean_mass
    fat_kg: fat_mass
preset: quick
n_jobs: 4
output:
  dir: ./zaku_out
  figures: true
figures:
  title: Synthetic example · lean mass (kg) vs fat mass (kg)
  subtitle: 7 curated indices · preset quick
  language: en
  labels: full
