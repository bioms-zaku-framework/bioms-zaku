# EN: minimal example (150 SYNTHETIC rows from tools/make_minimal_data.py; quick preset) — demonstrates the plumbing in seconds. Not for reporting.
# ES/PT: exemplo mínimo (150 linhas sintéticas; preset quick) — demonstra o fluxo em segundos. Não é para reportar.
run_name: minimal
data:
  path: examples/minimal_data.csv
  columns:
    variables: {R: resistencia_ohm, Xc: reatancia_ohm, H: estatura_cm, W: massa_kg}
    units: {H: cm, W: kg}
    targets: {LMI_DXA: lmi_dxa}
    controls: {FMI_DXA: fmi_dxa}
    covariates: [massa_kg, estatura_cm]
    groups: {sexo: sexo, idade: idade_anos}
    id: seqn
  min_n: 30
  min_per_class: 10
strata: null
algebra: {min_pair_n: 30}
audit:
  bootstrap: {min_oob: 20}
  cv: {folds: 3}          # EN: B and repeats come from the preset (quick: B 200, repeats 5)
catalog:
  include: [Lukaski1985_II, Baumgartner1988_PhA, Piccoli1994_RH, Piccoli1994_XcH, LMI, Kyle2001_FFM]   # EN: 4 indices + 1 composite + 1 equation
preset: quick
output: {dir: ./zaku_out, figures: true}
